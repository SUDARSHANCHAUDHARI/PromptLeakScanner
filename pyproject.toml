[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promptleakscanner"
version = "1.0.0"
description = "Security test runner for prompt injection, leakage, jailbreak, and unsafe-response checks in AI apps"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

[project.scripts]
prompt-leak-scanner = "apps.api.app.cli:main"
